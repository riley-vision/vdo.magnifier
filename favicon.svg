<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="mg" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="ag" cx="75%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.3"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="32" height="32" rx="6"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0d0d0d"/>

  <!-- Aurora blobs, clipped to rounded rect -->
  <g clip-path="url(#clip)">
    <ellipse cx="6" cy="8" rx="14" ry="12" fill="url(#mg)" opacity="0.85"/>
    <ellipse cx="26" cy="24" rx="12" ry="10" fill="url(#ag)" opacity="0.85"/>
    <ellipse cx="24" cy="6" rx="10" ry="8" fill="#06b6d4" opacity="0.25"/>
  </g>

  <!-- Magnifier lens -->
  <circle cx="13" cy="13" r="8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Handle -->
  <line x1="19" y1="19" x2="27" y2="27" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Scan lines inside lens -->
  <line x1="8"  y1="11"   x2="18" y2="11"   stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="8"  y1="13.5" x2="18" y2="13.5" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="8"  y1="16"   x2="18" y2="16"   stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
</svg>
